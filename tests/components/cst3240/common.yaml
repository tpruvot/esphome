display:
  - platform: ssd1306_i2c
    i2c_id: i2c_bus
    id: cst3240_ssd1306_i2c_display
    model: SSD1306_128X64
    reset_pin: ${display_reset_pin}
    pages:
      - id: cst3240_page1
        lambda: |-
          it.rectangle(0, 0, it.get_width(), it.get_height());

touchscreen:
  - platform: cst3240
    i2c_id: i2c_bus
    id: cst3240_touchscreen
    display: cst3240_ssd1306_i2c_display
    interrupt_pin: ${interrupt_pin}
    reset_pin: ${reset_pin}
